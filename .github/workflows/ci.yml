name: memorylint
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m venv /tmp/memorylint-wheel-check
      - run: /tmp/memorylint-wheel-check/bin/python -m pip install --no-index --no-deps dist/*.whl
      - run: /tmp/memorylint-wheel-check/bin/python -m unittest discover -s tests -v
      - run: /tmp/memorylint-wheel-check/bin/python -m pip install 'PyYAML>=6,<7'
      - run: /tmp/memorylint-wheel-check/bin/python -m unittest discover -s tests -v
      - run: /tmp/memorylint-wheel-check/bin/memorylint evaluate --dataset evals/heldout.json
